<!doctype html>
<html>
<head><meta charset="utf-8"><title>App Icon Preview</title></head>
<body style="margin:0;background:#1a1a1a;display:flex;gap:60px;align-items:center;justify-content:center;height:100vh;font-family:system-ui;color:#aaa">
  <div style="text-align:center">
    <div style="font-size:12px;margin-bottom:14px">1024px (full)</div>
    <img src="/app-icon.svg" style="width:320px;height:320px;border-radius:72px;box-shadow:0 24px 60px rgba(0,0,0,0.5)"/>
  </div>
  <div style="text-align:center">
    <div style="font-size:12px;margin-bottom:14px">120px (home screen)</div>
    <img src="/app-icon.svg" style="width:120px;height:120px;border-radius:27px;box-shadow:0 8px 24px rgba(0,0,0,0.4)"/>
  </div>
  <div style="text-align:center">
    <div style="font-size:12px;margin-bottom:14px">60px (settings)</div>
    <img src="/app-icon.svg" style="width:60px;height:60px;border-radius:13px"/>
  </div>
</body>
</html>
