<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Waypoint app icon (maskable: full-bleed field, art inside the 80% safe
       zone). The mission as a place: paper map, contour lines, a walked
       stretch, the dotted route ahead, the flag at the summit. -->
  <rect width="1024" height="1024" fill="#F4F1E6"/>

  <!-- faint contours, top-right -->
  <g fill="none" stroke="#AFA689" stroke-width="7" opacity="0.3">
    <circle cx="860" cy="140" r="260"/>
    <circle cx="860" cy="140" r="340"/>
    <circle cx="860" cy="140" r="420"/>
  </g>

  <!-- ground under the flag -->
  <ellipse cx="640" cy="640" rx="130" ry="28" fill="#EBE7D6"/>

  <!-- the route ahead — a dotted stretch to the summit -->
  <path d="M 480 700 C 540 668 610 660 640 622"
        fill="none" stroke="#AFA689" stroke-width="20"
        stroke-dasharray="2 46" stroke-linecap="round"/>

  <!-- the walked stretch -->
  <path d="M 240 800 C 330 792 420 742 480 700"
        fill="none" stroke="#4E7C2A" stroke-width="26" stroke-linecap="round"/>

  <!-- you -->
  <circle cx="480" cy="700" r="32" fill="#B5501A"/>
  <circle cx="480" cy="700" r="13" fill="#FCFBF4"/>

  <!-- the summit flag -->
  <line x1="640" y1="628" x2="640" y2="330" stroke="#23281F"
        stroke-width="24" stroke-linecap="round"/>
  <path d="M 640 330 L 830 398 L 640 466 Z" fill="#B5501A"/>
</svg>
